[project]
name = "folha-ponto"
version = "2.0.0.dev0"
description = "Folha de ponto pessoal: app 100% offline no celular, com SQLite local."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet>=1.1.0",
    "holidays>=0.108",
]

[project.scripts]
folha-ponto = "folha_ponto.ui.app:executar"

[dependency-groups]
dev = [
    "flet-desktop>=1.1.0,<1.2",
    "flet-web>=1.1.0,<1.2",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ---- APK (WP7): uv run flet build apk ------------------------------------------
[tool.flet]
product = "Folha de Ponto"
org = "io.github.henrique_melo_rodrigues"
company = "Henrique Rodrigues"
copyright = "Henrique Rodrigues"

[tool.flet.app]
path = "src"        # o APK leva src/main.py e o pacote folha_ponto
module = "main"

[tool.flet.android]
# No Android as libs vão num zip (zipimport). A holidays lê as traduções (.mo) por
# caminho real (gettext + __file__), então precisa ir extraída para o disco.
# Sem isso o app quebra ao abrir: "No translation file found for domain: 'BR'".
extract_packages = ["holidays"]

[tool.flet.android.permission]
# RNF01: 100% offline. O flet build inclui INTERNET por padrão; aqui ela sai.
"android.permission.INTERNET" = false
