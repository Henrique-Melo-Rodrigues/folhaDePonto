[project]
name = "folha-ponto"
version = "2.0.0.dev0"
description = "Folha de ponto pessoal: app 100% offline no celular, com SQLite local."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet>=1.1.0",
    "holidays>=0.108",
]

[project.scripts]
folha-ponto = "folha_ponto.ui.app:executar"

[dependency-groups]
dev = [
    "flet-desktop>=1.1.0,<1.2",
    "flet-web>=1.1.0,<1.2",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
