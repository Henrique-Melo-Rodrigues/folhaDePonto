name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "src/mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "src/mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"

      - name: Baixar dependencias
        run: flutter pub get

      - name: Analisar codigo
        run: flutter analyze

      - name: Rodar testes
        run: flutter test

  build-apk:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"

      - name: Baixar dependencias
        run: flutter pub get

      # API_BASE_URL e API_KEY ficam como secrets do repositorio no GitHub.
      - name: Build APK debug
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL="${{ secrets.API_BASE_URL }}" \
            --dart-define=API_KEY="${{ secrets.API_KEY }}"

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: folha-de-ponto-apk
          path: src/mobile/build/app/outputs/flutter-apk/app-debug.apk
