name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "src/mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "src/mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # sqflite_common_ffi roda o SQLite na VM do Dart e carrega a libsqlite3
      # do sistema: sem ela os testes do DAO nao sobem no runner.
      - name: Instalar libsqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Baixar dependencias
        run: flutter pub get

      - name: Analisar codigo
        run: flutter analyze

      - name: Rodar testes
        run: flutter test

  build-apk:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Baixar dependencias
        run: flutter pub get

      # Sem --dart-define=API_BASE_URL de proposito: o APK publicado e o offline,
      # que roda inteiro no aparelho. O adapter remoto e opt-in, so num build
      # local (veja src/mobile/README.md).
      - name: Build APK debug offline
        run: flutter build apk --debug

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: folha-de-ponto-apk
          path: src/mobile/build/app/outputs/flutter-apk/app-debug.apk
