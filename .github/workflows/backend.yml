name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "src/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "src/backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Sincronizar dependencias
        run: uv sync

      - name: Rodar testes
        run: uv run python manage.py test
