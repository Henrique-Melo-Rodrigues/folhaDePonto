services:
  api:
    build: .
    container_name: folha_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
    depends_on:
      - mongodb
    # Sem "ports": a API NAO fica exposta direto na internet.
    # Apenas o Caddy alcanca a API pela rede interna do Docker.
    expose:
      - "8000"

  mongodb:
    image: mongo:7
    container_name: folha_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    # Sem "ports": o banco so e acessivel pela rede interna do Docker,
    # nunca pela internet.
    volumes:
      - mongo_data:/data/db

  caddy:
    image: caddy:2-alpine
    container_name: folha_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
