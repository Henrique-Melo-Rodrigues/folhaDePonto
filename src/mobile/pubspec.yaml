name: folha_de_ponto
description: App Android MVP para folha de ponto pessoal.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Banco embarcado no aparelho: o app roda offline, sem servidor.
  sqflite: ^2.3.0
  path: ^1.9.0
  # Usado apenas pelo adapter remoto opt-in (data/remote_time_record_store.dart).
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Roda o SQLite na VM do Dart para testar o DAO sem emulador.
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true

